<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phòng Khám Ngoại Trú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Cảnh phòng khám 2D ở giữa; tab dọc hai mép như Full Code. Mỗi tab là một khung trò chuyện, không bày sẵn lựa chọn. */
:root{
  --bar:#20384a; --bar-ink:#eef4f7; --accent:#0f5e7a; --accent-2:#1696c4; --accent-soft:#e6f1f5;
  --panel:#ffffff; --panel-2:#f4f5f3; --ink:#1c1c1a; --muted:#64645c; --line:#e2e1dc;
  --ok:#1d7449; --ok-soft:#dff1e6; --warn:#97590c; --warn-soft:#fbebd3; --bad:#b0261e; --bad-soft:#f8deda;
  --f-display:"Lora",Georgia,serif; --f-body:"Be Vietnam Pro",system-ui,"Segoe UI",Arial,sans-serif; --f-mono:"Roboto Mono",ui-monospace,Consolas,monospace;
  --pw:min(420px,88vw); color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#cdd6d8;color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
[hidden]{display:none!important}
h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.25}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--muted)}

.topbar{height:52px;background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:16px;padding:0 14px;border-bottom:2px solid #e9a68c}
.case-no{display:flex;flex-direction:column;line-height:1.05;align-items:center;font-size:11px;opacity:.85}
.case-no b{font-family:var(--f-mono);font-size:15px;font-weight:500}
.title{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hud{margin-left:auto;display:flex;gap:12px;align-items:center;font-size:12px}
.hud .m{display:flex;flex-direction:column;line-height:1.15;align-items:flex-end}
.hud b{font-family:var(--f-mono);font-size:15px;font-weight:500}
.tbtn{background:rgba(255,255,255,.12);border:0;color:var(--bar-ink);border-radius:8px;padding:6px 10px;font-size:13px;white-space:nowrap}

.stage{position:relative;height:calc(100% - 52px);overflow:hidden}
.scene{position:absolute;inset:0}
.scene svg{width:100%;height:100%;display:block}
.rail{position:absolute;top:14px;bottom:70px;display:flex;flex-direction:column;gap:6px;z-index:4;transition:transform .25s}
.rail.left{left:0}.rail.right{right:0}
.rtab{writing-mode:vertical-rl;background:rgba(255,255,255,.94);border:1px solid var(--line);padding:16px 8px;font-size:14px;color:#3b5566;box-shadow:0 2px 8px rgba(0,0,0,.08);position:relative}
.rail.right .rtab{border-radius:10px 0 0 10px}
.rail.left .rtab{transform:rotate(180deg);border-radius:10px 0 0 10px}
.rtab[aria-pressed="true"]{background:var(--accent-2);color:#fff;border-color:var(--accent-2)}
.rtab .dot{position:absolute;top:6px;left:6px;width:9px;height:9px;border-radius:50%;background:#e2553f}
.rail.left.shift{transform:translateX(var(--pw))}.rail.right.shift{transform:translateX(calc(-1 * var(--pw)))}
.panel{position:absolute;top:0;bottom:0;width:var(--pw);background:var(--panel);z-index:3;display:flex;flex-direction:column;box-shadow:0 0 24px rgba(0,0,0,.15);transition:transform .25s ease}
.panel.left{left:0;transform:translateX(-102%)}.panel.right{right:0;transform:translateX(102%)}
.panel.open{transform:none}
.p-head{padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.p-head h3{font-size:17px}
.p-body{flex:1;overflow:auto;padding:12px 14px;background:#fafaf8}
.p-foot{border-top:1px solid var(--line);padding:10px 12px;display:grid;gap:6px}
.p-foot .row{display:flex;gap:8px;align-items:flex-end}
.p-foot textarea{flex:1;resize:none;min-height:42px;max-height:120px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--panel-2)}
.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:600;background:var(--accent);color:#fff}
.btn.ghost{background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.err{color:var(--bad);font-size:13px}
.pt-card{display:flex;gap:12px;align-items:center}
.ava{width:60px;height:60px;border-radius:50%;overflow:hidden;flex:none;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.ava svg{width:100%;height:100%;display:block}
.kv{font-size:13px;color:var(--muted);line-height:1.55}
.kv b{color:var(--ink);font-weight:500}

.log{display:flex;flex-direction:column;gap:8px}
.b{max-width:90%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.b .who{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:1px}
.b.in{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.b.dr{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.b.res{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent-2);border-bottom-left-radius:4px}
.b.res.abn{border-left-color:var(--bad)}
.b.res.abn .r{color:var(--bad)}
.b.res .t{font-weight:600;display:flex;justify-content:space-between;gap:8px}
.b.res .t small{font-family:var(--f-mono);font-weight:400;color:var(--muted)}
.b.res .md{margin-top:6px}
.b.res .md-l{font-weight:600}
.b.res audio{display:block;width:100%;max-width:340px;height:36px;margin-top:4px}
.xn{margin-top:6px;overflow-x:auto}
.xn-t{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.xn table{border-collapse:collapse;font-size:12.5px;width:100%;min-width:360px}
.xn th,.xn td{border:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:top}
.xn th{background:var(--panel-2);font-weight:600}
.xn tr.xn-ab td:nth-child(2){color:var(--bad);font-weight:700}
.xn-g{font-size:12px;color:var(--muted);margin-top:4px;font-style:italic}
.b.nurse{background:var(--accent-soft);border-bottom-left-radius:4px}
.b.lock{background:var(--warn-soft);color:var(--warn);border-bottom-left-radius:4px}
.b.ok{background:var(--ok-soft);border-bottom-left-radius:4px}
.divider{align-self:center;font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding:4px 0}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:24px 8px}
.typing{font-size:13px;color:var(--muted);font-style:italic}

.speech{position:absolute;z-index:2;width:max-content;max-width:min(280px,64vw);background:#fff;border-radius:16px;padding:10px 14px;font-size:14.5px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.15);transform:translate(-50%,-100%);cursor:pointer;overflow-wrap:anywhere}
.speech::after{content:"";position:absolute;left:var(--tail,50%);margin-left:-10px;bottom:-9px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
.speech .who{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:2px}
.speech.bs{background:#e3f1f7}.speech.bs::after{border-top-color:#e3f1f7}
.speech.bs .who{color:var(--accent)}
.speech.dang{color:var(--muted);font-style:italic}
.speech{transition:opacity .8s ease}.speech.an{opacity:0;pointer-events:none}
.speech.khong-duoi::after{display:none}
/* Màn hình Hồ sơ bệnh án điện tử: ô nhập câu hỏi. Nằm đúng trên màn hình trong cảnh; khi màn hình bị cắt (màn hẹp) hoặc ở góc giường khám thì thu thành thanh dưới đáy */
.emr{position:absolute;z-index:2;display:flex;flex-direction:column;background:#eaf4f8;overflow:hidden;font-size:13px}
.emr.tren-man{border-radius:3px}
.emr.day{left:50%;transform:translateX(-50%);bottom:68px;width:min(560px,calc(100vw - 96px));border-radius:12px;border:3px solid #2a363c;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.emr-h{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#20384a;color:#fff;font-size:11px;padding:3px 8px;white-space:nowrap}
.emr-h button{background:none;border:0;color:#bfe3f2;font-size:11px;padding:0;text-decoration:underline;overflow:hidden;text-overflow:ellipsis}
.emr-b{flex:1;display:flex;gap:6px;padding:6px;align-items:stretch;min-height:0}
.emr textarea{flex:1;resize:none;border:1px solid #b9cfd8;border-radius:6px;padding:6px 8px;background:#fff;font-size:13.5px;line-height:1.35;min-height:0}
.emr.day textarea{min-height:44px}
.emr .btn{padding:6px 12px;align-self:flex-end}
.emr-e{color:var(--bad);font-size:11.5px;padding:0 8px 4px;line-height:1.3}
.emr-e:empty{display:none}
.team{position:absolute;top:14px;right:92px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0}
.team .face{width:60px;height:60px;border-radius:50%;background:#fff;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.18);overflow:hidden;position:relative;transition:transform .15s}
.team:hover .face{transform:scale(1.06)}
.team[aria-pressed="true"] .face{border-color:var(--accent-2)}
.team .dot{position:absolute;top:0;right:0;width:12px;height:12px;border-radius:50%;background:#e2553f;border:2px solid #fff}
.pt-hit{cursor:pointer}
.pt-hit:hover{filter:brightness(1.06) drop-shadow(0 0 6px rgba(22,150,196,.55))}
.notify{cursor:pointer}
.team .face svg{width:100%;height:100%;display:block}
.team .lbl{font-size:12px;background:rgba(255,255,255,.92);padding:1px 8px;border-radius:6px;color:#3b5566}
.notify{position:absolute;right:88px;top:100px;z-index:2;background:#fff;border-radius:12px;padding:8px 12px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.15);max-width:260px}
.exam-pop{position:absolute;left:50%;bottom:180px;transform:translateX(-50%);z-index:2;background:#fff;border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.18);max-width:min(440px,70vw);border-left:4px solid var(--accent-2)}
.vitals{position:absolute;left:60px;top:14px;z-index:2;background:#0e1a20;color:#d8f5e6;border-radius:12px;padding:9px 12px;font-family:var(--f-mono);display:grid;grid-template-columns:auto auto;gap:1px 14px;box-shadow:0 6px 18px rgba(0,0,0,.25);border:3px solid #34444c}
.vitals span{font-size:10.5px;color:#8fb3a3;letter-spacing:.06em}
.vitals b{font-size:18px;font-weight:500}
.vitals .hr{color:#6cf09a}.vitals .bp{color:#ff8e7a}.vitals .sp{color:#7ad8ff}
.vitals canvas{grid-column:1/-1;width:180px;height:32px;margin-top:4px;display:block}
.dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:2;display:flex;gap:8px;background:rgba(255,255,255,.88);padding:6px;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.dock button{border:0;background:#fff;border-radius:999px;padding:8px 14px;font-size:13.5px;color:#2c4a5a;box-shadow:0 0 0 1px var(--line);white-space:nowrap}
.dock button[aria-pressed="true"]{background:var(--accent-2);color:#fff;box-shadow:none}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(20,30,36,.45);display:grid;place-items:center;padding:16px;overflow:auto}
.sheet{width:min(560px,100%);background:#fff;border-radius:16px;padding:22px 24px;box-shadow:0 10px 40px rgba(0,0,0,.25);display:grid;gap:14px}
.sheet .box{background:var(--panel-2);border-radius:10px;padding:12px 14px;line-height:1.55}
.field{display:grid;gap:5px}
.field label{font-weight:600;font-size:13.5px}
.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--panel-2)}
.sheet .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

.result-wrap{position:fixed;inset:52px 0 0 0;z-index:10;overflow:auto;background:#f7f7f5}
.result{max-width:1200px;margin:0 auto;padding:20px;display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:12px}
.score{padding:22px;text-align:center;position:sticky;top:0}
.ring{width:150px;height:150px;display:block;margin:6px auto 8px}
.grade{font-family:var(--f-display);font-size:22px;font-weight:700}
.bars{display:grid;gap:9px;margin-top:14px;text-align:left}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13.5px}
.bar{grid-column:1/-1;height:6px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.fb{padding:20px 24px}
.fb h2{font-size:21px}
.fb-v{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.fb-v>h3{font-size:18px}
.fb-s{margin-top:12px}
.fb-s h4{margin:0 0 7px;font-size:14.5px}
.fb-l{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.fb-l li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:14px}
.note{display:block;color:var(--muted);font-size:13px}
.chip{display:inline-flex;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--panel-2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.acc{background:var(--accent-soft);color:var(--accent)}
.outcome{margin-top:16px;padding:14px 18px;border-radius:10px;background:var(--panel-2);border-left:3px solid var(--warn)}
.learn{margin:10px 0 0;padding-left:18px;display:grid;gap:8px;max-width:78ch}
.spec{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 18px;font-size:13px;margin-top:10px}
.spec span{color:var(--muted)}
.diem{font-weight:500;color:var(--muted);font-size:12.5px;margin-left:6px;font-family:var(--f-mono)}
.ai{margin:6px 0 10px;padding:10px 14px;border-radius:9px;background:var(--accent-soft);font-size:14px;line-height:1.55;max-width:90ch;white-space:pre-wrap}
.ai-t{display:block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.ai.dang{color:var(--muted);font-style:italic;background:var(--panel-2)}
.ai.loi{background:var(--bad-soft);color:var(--bad)}
.ai-off{margin:4px 0 8px;color:var(--muted)}
.kq{margin:6px 0;font-size:14px;line-height:1.55}
.kq ul{margin:4px 0 0;padding-left:20px}
.tp{margin:10px 0;font-size:14px}
.tp>ul{list-style:none;margin:5px 0 0;padding:0;display:grid;gap:4px}
.tp li.co{color:var(--ok)}.tp li.khong{color:var(--bad)}.tp li.thieu{color:var(--warn)}
.tp>ul.fb-l li{color:inherit}
.dapan{margin:12px 0 4px;padding:12px 16px;border-radius:10px;background:var(--panel-2);border-left:3px solid var(--ok)}
.dapan p{margin:6px 0}
.pa{font-size:14px;line-height:1.6;max-width:92ch}
.dt{overflow-x:auto;margin:6px 0}
.dt table{border-collapse:collapse;width:100%;font-size:13.5px}
.dt th,.dt td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.dt th{background:var(--panel);font-weight:600;font-size:12.5px}
.dd{margin:4px 0 0;padding-left:20px;display:grid;gap:4px;font-size:14px;line-height:1.5}
@media (max-width:860px){.result{grid-template-columns:minmax(0,1fr)}.score{position:static}.hud .m.cost{display:none}.title{font-size:14.5px}.vitals{transform:scale(.78);transform-origin:top left}.team,.notify{right:70px}}
@media (prefers-reduced-motion:reduce){.panel,.rail{transition:none}}
.boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg,#f6f4ef);z-index:50;font:500 16px "Be Vietnam Pro",system-ui,sans-serif;color:#444}
.boot[hidden]{display:none}
.md-hinh{display:block;padding:0;border:1px solid var(--line,#ddd);border-radius:10px;overflow:hidden;background:#000;cursor:zoom-in;margin-top:6px;max-width:100%}
.md-hinh img{display:block;max-width:100%;max-height:260px;object-fit:contain}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:grid;place-items:center;z-index:100;cursor:zoom-out}
.zoom img{max-width:94vw;max-height:92vh;object-fit:contain}
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<div class="stage" id="stage">
  <div class="scene" id="scene"></div>
  <div id="ov"></div>
  <div class="emr" id="emr" hidden role="group" aria-label="Hồ sơ bệnh án điện tử – hỏi bệnh">
    <div class="emr-h"><span>Hồ sơ bệnh án điện tử · Hỏi bệnh</span><button type="button" id="emrLog">Lịch sử hỏi bệnh</button></div>
    <div class="emr-b"><textarea id="in-benhnhan" rows="2" placeholder="Nhập câu hỏi cho bệnh nhân…" aria-label="Câu hỏi cho bệnh nhân"></textarea><button class="btn" id="emrSend" type="button">Hỏi</button></div>
    <div class="emr-e" id="emrErr" aria-live="polite"></div>
  </div>
  <nav class="rail left" id="railL"></nav>
  <nav class="rail right" id="railR"></nav>
  <section class="panel left" id="P-benhnhan" aria-label="Bệnh nhân"></section>
  <section class="panel left" id="P-kham" aria-label="Khám"></section>
  <section class="panel left" id="P-chandoan" aria-label="Chẩn đoán"></section>
  <section class="panel right" id="P-dieuduong" aria-label="Điều dưỡng Linh"></section>
  <section class="panel right" id="P-cls" aria-label="Cận lâm sàng"></section>
  <section class="panel right" id="P-dieutri" aria-label="Điều trị"></section>
  <section class="panel right" id="P-ketluan" aria-label="Kết luận"></section>
  <div class="dock" role="group" aria-label="Góc nhìn">
    <button id="vBan" aria-pressed="true">🪑 Bàn khám</button>
    <button id="vGiuong" aria-pressed="false">🛏 Giường khám</button>
  </div>
</div>
<div id="result" hidden></div>
<div id="modal"></div>

<div id="boot" class="boot" role="status" aria-live="polite">Đang mở phòng khám…</div>
<script>
/* ===== Nạp dữ liệu từ các repo trên doctor-gau-1607.github.io =====
   pk-ngoai-tru          : app + danh mục + muc_luc.json (mục lục ca)
   pk-ngoai-tru-ca-N     : ca/<MÃ>.json
   pk-ngoai-tru-media-N  : am_thanh/…, hinh/…
   Đường dẫn tính từ gốc site nên chạy được cả trên máy (thư mục gốc chứa các thư mục cùng tên repo). */
const GOC = (() => { const p = location.pathname, i = p.indexOf('/pk-ngoai-tru/'); return i >= 0 ? p.slice(0, i + 1) : '/' })();
const URL_APP = GOC + 'pk-ngoai-tru/', urlCa = (r, ma) => `${GOC}pk-ngoai-tru-ca-${r}/ca/${ma}.json`, urlMedia = (r, tep) => `${GOC}pk-ngoai-tru-media-${r}/${tep}`;
const REPO_BAO_LOI = 'https://github.com/Doctor-Gau-1607/pk-ngoai-tru/issues/new';
const layJson = u => fetch(u, {cache:'no-cache'}).then(r => { if(!r.ok) throw new Error(r.status + ' ' + u); return r.json() });
(async () => {
  try {
    const [muc, cls, kham, media, tcxn, vt] = await Promise.all(['muc_luc.json', 'kho/danh_muc_cls.json', 'kho/danh_muc_kham.json', 'kho/danh_muc_media.json', 'kho/tham_chieu_xn.json', 'kho/viet_tat.json'].map(f => layJson(URL_APP + f)));
    window.__D = {muc, cls, kham, media, tcxn, vt};

Bây giờ là ${now.getHours()} giờ ${String(now.getMinutes()).padStart(2, '0')}, ${thu}.
# Cách nói

function kichBanDieuDuong(text){

/* Bác sĩ hay gõ tắt: đưa bảng viết tắt vào lời dặn để AI hiểu (bệnh nhân vẫn trả lời bằng lời thường) */
const vietTatAI = () => VT.cho_ai ? `\n\n# Từ viết tắt bác sĩ hay dùng (hiểu đúng nghĩa; người bệnh không cần nhắc lại chữ viết tắt)\n${VT.cho_ai}` : '';
function heThongBenhNhan(){
  const Lx = L(), prev = S.v > 0 ? S.visits[S.v - 1] : null;
  const facts = Lx.su_that.map(f => `- [${f.id}] (${f.che_do === 'tu_ke' ? 'có thể tự kể' : f.che_do === 'giau' ? 'GIẤU' : 'chỉ nói khi được hỏi'}) ${f.noi_dung}${f.dieu_kien_lo ? `\n    Điều kiện nói ra: ${f.dieu_kien_lo}` : ''}`).join('\n');
  const prevTxt = prev ? `\n# Lượt khám trước\nBác sĩ đã chẩn đoán: "${prev.dxText || 'không rõ'}". Đã xử trí: "${prev.mxText.join('; ') || 'không rõ'}". Bệnh nhân đang dùng thuốc được kê ở lượt trước. Diễn tiến lượt này luôn theo hồ sơ dưới đây.\n` : '';
  return `Bạn là bộ máy mô phỏng MỘT bệnh nhân ngoại trú để bác sĩ luyện hỏi bệnh. Người gõ tin nhắn luôn là bác sĩ.

# Nhân vật bạn đóng
${nhanVat()}
Kiểu khó khi khai thác: ${P.kieu_nhieu}
${prevTxt}
# ${Lx.ten}. Câu đã nói khi bước vào
"${Lx.loi_mo}"

# Hồ sơ sự thật (bí mật)
${facts}

# Danh sách xử trí để đối chiếu (TUYỆT ĐỐI không nói ra)
${Lx.xu_tri.map((m, i) => `${i}: ${m.t}`).join('\n')}

# Quy tắc
1. tra_loi là lời bệnh nhân (hoặc người nhà) nói, tiếng Việt đời thường, 1–3 câu, đúng tính cách và xưng hô. Không thuật ngữ y khoa bệnh nhân không biết. Không gạch đầu dòng, không mô tả hành động trong ngoặc.
2. Chỉ trả lời điều bác sĩ hỏi. Không tự kể thêm, trừ sự thật "có thể tự kể" khi hợp ngữ cảnh.
3. Sự thật GIẤU chỉ nói khi đúng điều kiện. Chưa đủ điều kiện thì né tránh như mô tả.
4. Mọi triệu chứng có thật đều có trong hồ sơ. Hỏi triệu chứng không có trong hồ sơ thì trả lời không có hoặc không để ý. Chi tiết đời thường không liên quan bệnh được trả lời ngắn, hợp lý, không tạo triệu chứng mới.
5. su_that_lo: id các sự thật mà NỘI DUNG THẬT vừa được nói ra (kể cả sự thật âm tính). Đang né tránh, chối, hoặc chỉ nói phiên bản che giấu thì KHÔNG đưa id đó vào.
6. Việc khám, xét nghiệm, chẩn đoán được bác sĩ ghi ở tab khác. Nếu bác sĩ nói sẽ khám hay cho xét nghiệm, bệnh nhân chỉ đáp ngắn ("Dạ."). Không tự nói kết quả khám, xét nghiệm, không đoán chẩn đoán.
7. Nếu bác sĩ giải thích, dặn dò, tư vấn hay kê thuốc trực tiếp với bệnh nhân: xu_tri_khop = số thứ tự các xử trí khớp; bệnh nhân phản ứng tự nhiên. Không thì mảng rỗng.
8. Không bao giờ ra khỏi vai, không nhắc tới AI, hồ sơ hay quy tắc.${vietTatAI()}`;
}
const SCHEMA_BN = {type:'object', additionalProperties:false, required:['nguoi_noi','tra_loi','su_that_lo','xu_tri_khop'],
  properties:{nguoi_noi:{type:'string', enum:['benh_nhan','nguoi_nha']}, tra_loi:{type:'string'}, su_that_lo:{type:'array', items:{type:'string'}}, xu_tri_khop:{type:'array', items:{type:'integer'}}}};
const SCHEMA_DX = {type:'object', additionalProperties:false, required:['la_xac_dinh','xac_dinh','phan_biet'],
  properties:{la_xac_dinh:{type:'boolean'}, xac_dinh:{type:'integer'}, phan_biet:{type:'array', items:{type:'integer'}}}};
const SCHEMA_MX = {type:'object', additionalProperties:false, required:['xu_tri_khop','nguoi_noi','tra_loi'],
  properties:{xu_tri_khop:{type:'array', items:{type:'integer'}}, nguoi_noi:{type:'string', enum:['benh_nhan','nguoi_nha']}, tra_loi:{type:'string'}}};
function heThongChanDoan(){
  return `Bạn là trợ lý chấm bài, đối chiếu chẩn đoán bác sĩ vừa ghi với danh sách có sẵn. Không nói chuyện, chỉ trả JSON.
Danh sách:
${L().chan_doan.map((d, i) => `${i}: ${d.t}`).join('\n')}
- la_xac_dinh = true nếu bác sĩ ghi một chẩn đoán xác định (chẩn đoán chính); false nếu chỉ liệt kê chẩn đoán phân biệt, cần loại trừ.
- xac_dinh = số thứ tự trong danh sách gần nghĩa nhất với chẩn đoán xác định bác sĩ ghi; -1 nếu không có mục nào cùng bệnh, cùng cơ chế. Đánh giá nghiêm: thiếu ý chính (ví dụ nguyên nhân, mức độ) mà vẫn cùng bệnh thì vẫn khớp; sai bệnh thì -1.
- phan_biet = các số thứ tự bác sĩ nêu như chẩn đoán phân biệt hoặc cần loại trừ.${vietTatAI()}`;

function heThongDieuTri(){
  return `Bạn đối chiếu y lệnh bác sĩ vừa ghi (thuốc, tư vấn, dặn dò, hẹn) với danh sách xử trí, rồi viết phản ứng ngắn của bệnh nhân.
Nhân vật: ${nhanVat()}
Danh sách xử trí (không nói ra):
${L().xu_tri.map((m, i) => `${i}: ${m.t}`).join('\n')}
- xu_tri_khop = số thứ tự các mục mà y lệnh của bác sĩ thực sự nói tới (cùng thuốc hoặc nhóm thuốc, cùng nội dung tư vấn). Không suy diễn thêm mục bác sĩ không nói.
- tra_loi = 1–2 câu phản ứng tự nhiên của bệnh nhân hoặc người nhà khi nghe y lệnh, đúng tính cách (hỏi cách uống, lo giá, đồng ý…). Không nhận xét đúng sai về y lệnh.${vietTatAI()}`;
}
function toGemini(s){
  if(s.type === 'object') return {type:'OBJECT', properties:Object.fromEntries(Object.entries(s.properties).map(([k, x]) => [k, toGemini(x)])), required:s.required, propertyOrdering:Object.keys(s.properties)};
  if(s.type === 'array') return {type:'ARRAY', items:toGemini(s.items)};
  const o = {type:s.type.toUpperCase()}; if(s.enum) o.enum = s.enum; return o;
}
async function callGemini(system, history, schema, cfg = CFG){
  const model = cfg.model || MAC_DINH_MO_HINH.gemini;
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
    method:'POST', headers:{'Content-Type':'application/json', 'x-goog-api-key':cfg.key},
    body:JSON.stringify({systemInstruction:{parts:[{text:system}]}, contents:history.map(h => ({role:h.role === 'assistant' ? 'model' : 'user', parts:[{text:h.content}]})),
      generationConfig:{responseMimeType:'application/json', responseSchema:toGemini(schema), temperature:0.7}})});
  const data = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(`Gemini báo lỗi ${res.status}: ${data.error?.message || res.statusText}`);
  const text = (data.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
  if(!text) throw new Error('Gemini không trả lời (có thể bị bộ lọc an toàn chặn). Thử diễn đạt lại.');
  return text;
}
async function callClaude(system, history, schema, cfg = CFG){
  const model = cfg.model || MAC_DINH_MO_HINH.claude;
  const res = await fetch('https://api.anthropic.com/v1/messages', {method:'POST',
    headers:{'Content-Type':'application/json', 'x-api-key':cfg.key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true', 'anthropic-beta':'server-side-fallback-2026-07-01'},
    body:JSON.stringify({model, max_tokens:4000, system, fallbacks:'default', output_config:{effort:'low', format:{type:'json_schema', schema}}, messages:history})});
  const data = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(`Claude báo lỗi ${res.status}: ${data.error?.message || res.statusText}`);
  if(data.stop_reason === 'refusal') throw new Error('Claude từ chối trả lời câu này. Thử diễn đạt lại.');
  const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  if(!text) throw new Error('Claude không trả về nội dung.');
  return text;
}
const callAI = (sys, hist, schema, cfg = CFG) => cfg.provider === 'claude' ? callClaude(sys, hist, schema, cfg) : callGemini(sys, hist, schema, cfg);
/* Gói miễn phí giới hạn số lượt gọi mỗi phút (lỗi 429): tự chờ rồi gửi lại, tối đa 3 lần */
async function goiAI(sys, hist, schema){
  for(let lan = 0; ; lan++){
    try { return JSON.parse(await callAI(sys, hist, schema)) }
    catch(e){
      const m = String(e.message || '');
      if(e instanceof SyntaxError) throw new Error('AI trả về sai định dạng. Gửi lại.');
      if(lan >= 3 || !/\b429\b|quota|rate/i.test(m)) throw e;
      let giay = Math.ceil(parseFloat((m.match(/retry in ([\d.]+)s/i) || [])[1]) || 30) + 1;
      while(giay > 0){ S.waitMsg = `Đang chờ ${giay} giây (gói AI miễn phí giới hạn số câu mỗi phút)…`; ui(); await new Promise(r => setTimeout(r, 1000)); giay-- }
      S.waitMsg = ''; ui();
    }
  }
}

async function guiBenhNhan(text){
  const v = V(), Lx = L();
  const qCu = v.lastQ; v.lastQ = text; v.bubAt = Date.now();
  v.th.benhnhan.push({from:'dr', text}); v.min += 1; v.history.push({role:'user', content:text});
  const intro = [{role:'user', content:'(Bác sĩ mời bệnh nhân vào phòng khám.)'}, {role:'assistant', content:JSON.stringify({nguoi_noi:firstSpeaker(), tra_loi:Lx.loi_mo, su_that_lo:[], xu_tri_khop:[]})}];
  try {
    const out = await goiAI(heThongBenhNhan(), [...intro, ...v.history], SCHEMA_BN);
    v.history.push({role:'assistant', content:JSON.stringify(out)});
    const ids = new Set(Lx.su_that.map(f => f.id)); (out.su_that_lo || []).forEach(id => ids.has(id) && v.facts.add(id));
    const mx = (out.xu_tri_khop || []).filter(i => i >= 0 && i < Lx.xu_tri.length);
    if(mx.length){ mx.forEach(i => v.mx.add(i)); v.mxText.push(text) }
    if(out.tra_loi){ v.th.benhnhan.push({from:'pt', text:out.tra_loi, nguoi:out.nguoi_noi}); v.lastPt = out.tra_loi; v.lastWho = out.nguoi_noi; v.bubAt = Date.now() }
  } catch(e){ v.history.pop(); v.th.benhnhan.pop(); v.min -= 1; v.lastQ = qCu; throw e }
}
async function guiChanDoan(text){
  const v = V(), Lx = L();
  v.th.chandoan.push({from:'dr', text}); v.min += 1;
  try {
    const out = await goiAI(heThongChanDoan(), [{role:'user', content:text}], SCHEMA_DX);
    (out.phan_biet || []).filter(i => i >= 0 && i < Lx.chan_doan.length).forEach(i => v.diff.add(i));
    if(out.la_xac_dinh){ v.dx = (out.xac_dinh >= 0 && out.xac_dinh < Lx.chan_doan.length) ? out.xac_dinh : -1; v.dxText = text; v.th.chandoan.push({from:'ok', text:'Đã ghi chẩn đoán xác định.'}) }
    else { v.diffText.push(text); v.th.chandoan.push({from:'ok', text:'Đã ghi chẩn đoán phân biệt.'}) }
  } catch(e){ v.th.chandoan.pop(); v.min -= 1; throw e }
}
async function guiDieuTri(text){
  const v = V(), Lx = L();
  v.th.dieutri.push({from:'dr', text}); v.min += 1;
  try {
    const out = await goiAI(heThongDieuTri(), [{role:'user', content:text}], SCHEMA_MX);
    (out.xu_tri_khop || []).filter(i => i >= 0 && i < Lx.xu_tri.length).forEach(i => v.mx.add(i));
    v.mxText.push(text);
    v.th.dieutri.push({from:'ok', text:'Đã ghi y lệnh.'});
    if(out.tra_loi){ v.th.dieutri.push({from:'pt', text:out.tra_loi, nguoi:out.nguoi_noi}); v.lastPt = out.tra_loi; v.lastWho = out.nguoi_noi; v.bubAt = Date.now() }
  } catch(e){ v.th.dieutri.pop(); v.min -= 1; throw e }
}

const CAN_AI = {benhnhan:true, chandoan:true, dieutri:true};
async function gui(tab, text){
  text = text.trim(); if(!text || S.busy) return;
  S.error[tab] = '';
  if(CAN_AI[tab] && !hasKey()){ openSettings(); return }
  if(tab === 'kham') guiKham(text);
  else if(tab === 'cls') guiCLS(text);
  else if(tab === 'ketluan') guiKetLuan(text);
  else {
    S.busy = tab; ui();
    try { if(tab === 'benhnhan') await guiBenhNhan(text); else if(tab === 'dieuduong') await guiDieuDuong(text); else if(tab === 'chandoan') await guiChanDoan(text); else await guiDieuTri(text) }
    catch(e){ S.error[tab] = e.message || String(e); S.retry = {tab, text} }
    S.busy = '';
  }
  ui();
  if(S.retry && S.retry.tab === tab){ const ta = $('#in-' + tab); if(ta) ta.value = S.retry.text; S.retry = null }
  focusTab(tab);
}
function focusTab(tab){ if(tab === 'benhnhan') $('#in-benhnhan')?.focus({preventScroll:true}); else if(tab && (S.open.left === tab || S.open.right === tab)) $('#in-' + tab)?.focus({preventScroll:true}); $('#stage').scrollLeft = 0; $('#stage').scrollTop = 0 }

function endVisit(){
  const v = V(), miss = [];

function placeBubbles(){

  const pl = S.open.left ? $('#P-' + S.open.left).getBoundingClientRect().right - st.left : 0, pr = S.open.right ? st.right - $('#P-' + S.open.right).getBoundingClientRect().left : 0;
  const lo = Math.max(pad, pl + 50), hi = st.width - Math.max(pad, pr + 50);
  document.querySelectorAll('#ov .speech').forEach(b => {
    const a = document.getElementById(b.dataset.anc); let x, y;
    if(a){ const r = a.getBoundingClientRect(); x = r.left + r.width / 2 - st.left; y = r.top - st.top }
    else { const e = $('#emr').getBoundingClientRect(); x = e.left + e.width / 2 - st.left; y = e.top - st.top - 14 }
    if(x < lo - 30 || x > hi + 30){ b.style.display = 'none'; return } /* người nói đang bị khung tab che */
    const w = b.offsetWidth, cx = Math.min(Math.max(x, lo + w / 2), hi - w / 2);
    b.style.left = cx + 'px'; b.style.top = Math.max(y, b.offsetHeight + 8) + 'px';

      ${daLam.map(t => li(VC[t.v][0], VC[t.v][1], `${esc(t.ten)} <span class="small">(${VND(t.gia)})</span>`, (t.r ? 'Kết quả: ' + esc(t.r) + '. ' : '') + esc(t.note) + (t.v === 'n' ? ' Trừ 2 điểm.' : ''))).join('')}
      ${r.lockedEss.map(t => li('acc', 'Cơ sở không có', esc(t.ten), esc(t.note) + ' Thay bằng: ' + (t.thay_the ? esc(testInfo(t.thay_the, Lx).ten) : 'đánh giá lâm sàng, chuyển tuyến khi cần') + '.')).join('')}
      ${!daLam.length && !thieu.length ? li('ok', 'Hợp lý', 'Ca này không cần cận lâm sàng bắt buộc.') : ''}</ul></div>`;
    /* 4. Chẩn đoán */
    const dg = d ? DG_CD[d.chan_doan.danh_gia] : (ch && ch.ok ? ['ok', 'Đúng bệnh'] : v.dxText ? ['bad', 'Chưa đúng'] : ['bad', 'Chưa ghi']);
    const tp = d && d.chan_doan.thanh_phan.length ? d.chan_doan.thanh_phan : (da.thanh_phan_chan_doan || []).map(t => ({ten:t, co:null}));
    const pb = Lx.chan_doan.map((x, i) => [x, i]).filter(([x]) => !x.ok);
    const okT = ok ? ok.t : '', okN = ok ? ok.n : '';
    const s4 = `<div class="fb-s"><h4>4. Chẩn đoán <span class="diem">${pt('Chẩn đoán')}/20</span></h4>
      <div class="kq"><span class="chip ${dg[0]}">${dg[1]}</span> <b>Bạn ghi:</b> ${esc(v.dxText || '(không ghi)')}${v.diffText.length ? `<br><b>Phân biệt bạn nêu:</b> ${v.diffText.map(esc).join(' · ')}` : ''}</div>
      ${tp.length ? `<div class="tp"><b>Thành phần của chẩn đoán đầy đủ:</b><ul>${tp.map(t => `<li class="${t.co === true ? 'co' : t.co === false ? 'khong' : ''}">${t.co === true ? '✓' : t.co === false ? '✗' : '•'} ${esc(t.ten)}</li>`).join('')}</ul></div>` : ''}
      ${d && d.chan_doan.thua_sai.length ? `<div class="tp"><b>Thừa hoặc sai:</b><ul>${d.chan_doan.thua_sai.map(x => `<li class="khong">✗ ${esc(x)}</li>`).join('')}</ul></div>` : ''}
      ${d ? `<div class="ai"><span class="ai-t">Nhận xét</span>${esc(d.chan_doan.nhan_xet)}</div>` : aiBox(k, 'cd')}
      <div class="dapan"><span class="eyebrow">Đáp án chuẩn</span><p><b>${esc(okT)}</b></p>${para(da.phan_tich_chan_doan) || `<p class="pa">${esc(okN)}</p>`}</div>
      <div class="tp"><b>Chẩn đoán phân biệt cần loại trừ:</b><ul class="fb-l">${pb.map(([x, i]) => li(v.diff.has(i) ? 'ok' : 'acc', v.diff.has(i) ? 'Bạn đã nêu' : 'Chưa nêu', esc(x.t), esc(x.n))).join('')}</ul></div></div>`;
    /* 5. Xử trí */
    const dx = d ? DG_XT[d.xu_tri.danh_gia] : null;
    const mucChon = Lx.xu_tri.map((m, i) => [m, i]).filter(([m, i]) => v.mx.has(i)), boSot = Lx.xu_tri.filter((m, i) => m.v === 'c' && !v.mx.has(i));
    const thuocBan = d ? d.thuoc : [];
    const s5 = `<div class="fb-s"><h4>5. Xử trí <span class="diem">${pt('Xử trí')}/20</span></h4>
      <div class="kq"><span class="chip ${r.dispoOk ? 'ok' : 'bad'}">${r.dispoOk ? 'Hướng xử trí đúng' : 'Hướng xử trí chưa đúng'}</span> <b>Bạn chọn:</b> ${esc(v.dispoText || '(không ghi)')}${r.dispoOk ? '' : ` · <b>Đáp án:</b> ${esc(KET_LUAN[Lx.ket_luan])} (−5 điểm)`}</div>
      <div class="kq"><b>Y lệnh, tư vấn bạn ghi:</b>${v.mxText.length ? `<ul>${v.mxText.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ' (không ghi)'}</div>
      ${d ? `<div class="kq"><span class="chip ${dx[0]}">${dx[1]}</span></div>
        ${d.xu_tri.dung.length ? `<div class="tp"><b>Làm đúng:</b><ul>${d.xu_tri.dung.map(x => `<li class="co">✓ ${esc(x)}</li>`).join('')}</ul></div>` : ''}
        ${d.xu_tri.thieu.length ? `<div class="tp"><b>Còn thiếu:</b><ul>${d.xu_tri.thieu.map(x => `<li class="thieu">＋ ${esc(x)}</li>`).join('')}</ul></div>` : ''}
        ${d.xu_tri.thua_sai.length ? `<div class="tp"><b>Thừa, không phù hợp hoặc sai:</b><ul>${d.xu_tri.thua_sai.map(x => `<li class="khong">✗ ${esc(x)}</li>`).join('')}</ul></div>` : ''}
        <div class="ai"><span class="ai-t">Nhận xét</span>${esc(d.xu_tri.nhan_xet)}</div>` : aiBox(k, 'xt')}
      ${thuocBan.length ? `<div class="tp"><b>Từng thuốc bạn kê:</b>${bang(['Bạn kê', 'Đánh giá', 'Nhận xét'], thuocBan.map(t => [esc(t.ban_ke), `<span class="chip ${(DG_T[t.danh_gia] || DG_T.ngoai_dap_an)[0]}">${(DG_T[t.danh_gia] || DG_T.ngoai_dap_an)[1]}</span>`, esc(t.nhan_xet)]))}</div>` : ''}
      <div class="tp"><b>Đối chiếu danh mục xử trí:</b><ul class="fb-l">${mucChon.map(([m]) => li(VL[m.v][0], VL[m.v][1], esc(m.t), esc(m.n) + (m.v === 'w' ? ' (−3 điểm)' : m.v === 'h' ? ' (−6 điểm)' : ''))).join('')}${boSot.map(m => li('warn', 'Bỏ sót', esc(m.t), esc(m.n))).join('')}</ul></div>
      <div class="dapan"><span class="eyebrow">Xử trí chuẩn</span><p><b>Hướng xử trí: ${esc(KET_LUAN[Lx.ket_luan] || '')}</b></p>${para(da.phan_tich_xu_tri)}
        ${da.don_thuoc && da.don_thuoc.length ? `<p class="pa"><b>Đơn thuốc chuẩn</b></p>${bang(['Thuốc', 'Liều, đường dùng', 'Thời điểm', 'Thời gian', 'Lý do, lưu ý'], da.don_thuoc.map(t => [`<b>${esc(t.thuoc)}</b>${t.ham_luong ? '<br><span class="small">' + esc(t.ham_luong) + '</span>' : ''}`, esc(t.lieu) + '<br><span class="small">' + esc(t.duong) + '</span>', esc(t.thoi_diem), esc(t.so_ngay), esc(t.ghi_chu || '')]))}` : ''}
        ${da.dan_do && da.dan_do.length ? `<p class="pa"><b>Lời dặn người bệnh</b></p><ul class="dd">${da.dan_do.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div></div>`;
    return `<div class="fb-v"><h3>${esc(Lx.ten)} · ${Math.round(r.total)}/100</h3>${s1}${s2}${s3}${s4}${s5}</div>`;
  };
  const sc = CA.so_cai;
  $('#result').innerHTML = `<div class="result-wrap"><div class="result">
    <aside class="card score"><span class="eyebrow">Phiếu chấm · ${esc(CA.ma_ca)}</span>
      <svg class="ring" viewBox="0 0 150 150" role="img" aria-label="${total} trên 100 điểm"><circle cx="75" cy="75" r="60" fill="none" style="stroke:var(--panel-2)" stroke-width="12"/><circle cx="75" cy="75" r="60" fill="none" style="stroke:var(--${g[1]})" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - total / 100)}" transform="rotate(-90 75 75)"/><text x="75" y="83" text-anchor="middle" font-size="36" style="fill:var(--ink);font-family:var(--f-mono)">${total}</text><text x="75" y="102" text-anchor="middle" font-size="12" style="fill:var(--muted)">/ 100 điểm</text></svg>
      <div class="grade" style="color:var(--${g[1]})">${g[0]}</div>
      <div class="bars">${R.map((r, k) => `<div class="eyebrow" style="margin-top:6px">${esc(L(k).ten)}</div>` + r.p.map(([n, s, m]) => `<div class="bar-row"><span>${n}</span><b class="mono">${Math.round(s)}/${m}</b><div class="bar"><i style="width:${s / m * 100}%"></i></div></div>`).join('')).join('')}</div>
      <div style="margin-top:16px;display:grid;gap:8px"><button class="btn" id="nextPt">Bệnh nhân kế tiếp</button><button class="btn ghost" id="again">Khám lại ca này</button></div></aside>
    <section class="card fb"><span class="eyebrow">${esc(P.ten)} · ${P.gioi}, ${P.tuoi} tuổi</span><h2>Nhận xét buổi khám</h2>
      ${S.visits.map((v, k) => fbv(v, R[k], k)).join('')}
      <div class="fb-v"><h3>Diễn tiến sau đó</h3><div class="outcome"><p style="margin:0">${esc(CA.ket_cuc)}</p></div></div>
      <div class="fb-v"><h3>Dữ kiện nhiễu</h3><ul class="learn">${CA.nhieu.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
      <div class="fb-v"><h3>Bài học từ tình huống</h3><ul class="learn">${CA.bai_hoc_bien.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
      <div class="fb-v"><h3>Điểm cần nhớ</h3><ol class="learn">${CA.diem_nho.map(x => `<li>${esc(x)}</li>`).join('')}</ol><p class="small" style="margin-top:12px">Nguồn: ${CA.nguon.map(esc).join(' · ')}</p></div>
      <div class="fb-v"><h3>Đặc tả ca trong sổ cái</h3><div class="spec">${Object.entries({'Mã ca':CA.ma_ca, 'Chẩn đoán đích':sc.chan_doan_dich, 'Phải loại trừ':sc.chan_doan_phai_loai_tru.join('; '), 'Độ khó':sc.do_kho, 'Bẫy':sc.loai_bay, 'Số lượt':sc.so_luot_kham, 'Diễn tiến':sc.dien_tien_tai_kham, 'Nhiễu':sc.nhieu_benh_nhan, 'Ràng buộc':sc.rang_buoc_nguon_luc, 'Nghề':sc.nghe_nghiep, 'Khởi phát':sc.yeu_to_khoi_phat, 'Thuốc đang dùng':sc.thuoc_dang_dung, 'Lý do thật':sc.ly_do_that_su_den_kham, 'Kết cục':sc.loai_ket_cuc}).map(([k, x]) => `<div><span>${k}:</span> ${esc(x)}</div>`).join('')}</div></div>
    </section></div></div>`;
  $('#again').onclick = () => startCase(CA);
  $('#nextPt').onclick = () => rutCa();
  document.querySelectorAll('[data-nx]').forEach(b => b.onclick = () => { S.nx = {}; S.nxDang = false; renderResult() });
  DONE.add(CA.ma_ca); saveDone();
  layNhanXet();
}

function ui(){
  renderTop();
  if(S.done){ $('#result').hidden = false; placeEmr(); renderResult(); return }
  TAB_KEYS.forEach(renderPanel); renderOverlays(); renderRails();
  $('#stage').scrollLeft = 0; $('#stage').scrollTop = 0;
}
$('#emrSend').onclick = () => { const ta = $('#in-benhnhan'), t = ta.value; ta.value = ''; gui('benhnhan', t) };
$('#in-benhnhan').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); $('#emrSend').click() } });
$('#emrLog').onclick = () => moTab('left', 'benhnhan');
let rzRaf; addEventListener('resize', () => { cancelAnimationFrame(rzRaf); rzRaf = requestAnimationFrame(() => { if(inCase && !S.done){ placeEmr(); placeBubbles() } }) });
$('#vBan').onclick = () => { S.view = 'ban'; drawScene(); ui() };
$('#vGiuong').onclick = () => { S.view = 'giuong'; drawScene(); ui() };
$('#boot').hidden = true;
(() => { const m = location.hash.match(/^#ca=([A-Z]{2}-\d{4})$/i); if(m && MUC.some(c => c.ma === m[1].toUpperCase())) return moCa(m[1].toUpperCase()); return rutCa() })();
</script>
</body>
</html>
